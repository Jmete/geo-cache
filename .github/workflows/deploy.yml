name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Write wrangler config
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          KV_PREVIEW_ID: ${{ vars.KV_PREVIEW_ID }}
          RATE_LIMIT_NAMESPACE_ID_DEMO: ${{ vars.RATE_LIMIT_NAMESPACE_ID_DEMO }}
          RATE_LIMIT_NAMESPACE_ID_BASIC: ${{ vars.RATE_LIMIT_NAMESPACE_ID_BASIC }}
          RATE_LIMIT_NAMESPACE_ID_PRO: ${{ vars.RATE_LIMIT_NAMESPACE_ID_PRO }}
          RATE_LIMIT_NAMESPACE_ID_SCALE: ${{ vars.RATE_LIMIT_NAMESPACE_ID_SCALE }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOW_LOCALHOST_HOSTS: ${{ vars.ALLOW_LOCALHOST_HOSTS }}
          LOG_GEOCODE_HITS: ${{ vars.LOG_GEOCODE_HITS }}
        run: |
          set -euo pipefail

          required_vars=(
            D1_DATABASE_ID
            D1_DATABASE_NAME
            KV_NAMESPACE_ID
            KV_PREVIEW_ID
            RATE_LIMIT_NAMESPACE_ID_DEMO
            RATE_LIMIT_NAMESPACE_ID_BASIC
            RATE_LIMIT_NAMESPACE_ID_PRO
            RATE_LIMIT_NAMESPACE_ID_SCALE
            ALLOWED_ORIGINS
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required variable: ${var}" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');

          const required = {
            D1_DATABASE_ID: process.env.D1_DATABASE_ID,
            D1_DATABASE_NAME: process.env.D1_DATABASE_NAME,
            KV_NAMESPACE_ID: process.env.KV_NAMESPACE_ID,
            KV_PREVIEW_ID: process.env.KV_PREVIEW_ID,
            RATE_LIMIT_NAMESPACE_ID_DEMO: process.env.RATE_LIMIT_NAMESPACE_ID_DEMO,
            RATE_LIMIT_NAMESPACE_ID_BASIC: process.env.RATE_LIMIT_NAMESPACE_ID_BASIC,
            RATE_LIMIT_NAMESPACE_ID_PRO: process.env.RATE_LIMIT_NAMESPACE_ID_PRO,
            RATE_LIMIT_NAMESPACE_ID_SCALE: process.env.RATE_LIMIT_NAMESPACE_ID_SCALE,
            ALLOWED_ORIGINS: process.env.ALLOWED_ORIGINS,
          };

          const template = fs.readFileSync('wrangler.toml.template', 'utf8');
          let output = template;

          const escapeTomlString = (value, key) => {
            if (value == null || value === '') {
              throw new Error(`Missing required variable: ${key}`);
            }
            if (value.includes('\n') || value.includes('\r')) {
              throw new Error(`Invalid newline in ${key}`);
            }
            return value.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
          };

          for (const [key, value] of Object.entries(required)) {
            const placeholder = `__${key}__`;
            const safeValue = escapeTomlString(value, key);
            output = output.split(placeholder).join(safeValue);
          }

          const optionalLines = [];
          if (process.env.ALLOW_LOCALHOST_HOSTS) {
            optionalLines.push(
              `ALLOW_LOCALHOST_HOSTS = "${escapeTomlString(process.env.ALLOW_LOCALHOST_HOSTS, 'ALLOW_LOCALHOST_HOSTS')}"`
            );
          }
          if (process.env.LOG_GEOCODE_HITS) {
            optionalLines.push(
              `LOG_GEOCODE_HITS = "${escapeTomlString(process.env.LOG_GEOCODE_HITS, 'LOG_GEOCODE_HITS')}"`
            );
          }

          const optionalBlock = optionalLines.length ? `${optionalLines.join('\n')}\n` : '';
          output = output.replace('__OPTIONAL_VARS__\n', optionalBlock);
          output = output.replace('__OPTIONAL_VARS__', optionalBlock.trimEnd());

          fs.writeFileSync('wrangler.toml', output);
          NODE
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
