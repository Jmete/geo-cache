name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Worker
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Write wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          KV_PREVIEW_ID: ${{ secrets.KV_PREVIEW_ID }}
          RATE_LIMIT_NAMESPACE_ID: ${{ secrets.RATE_LIMIT_NAMESPACE_ID }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ALLOW_LOCALHOST_HOSTS: ${{ secrets.ALLOW_LOCALHOST_HOSTS }}
          LOG_GEOCODE_HITS: ${{ secrets.LOG_GEOCODE_HITS }}
        run: |
          set -euo pipefail

          required_vars=(
            D1_DATABASE_ID
            D1_DATABASE_NAME
            KV_NAMESPACE_ID
            KV_PREVIEW_ID
            RATE_LIMIT_NAMESPACE_ID
            ALLOWED_ORIGINS
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: ${var}" >&2
              exit 1
            fi
          done

          cat > wrangler.toml <<EOF
          name = "geo-cache"
          main = "src/index.ts"
          compatibility_date = "2025-01-01"
          compatibility_flags = ["nodejs_compat"]

          [vars]
          ALLOWED_ORIGINS = "${ALLOWED_ORIGINS}"
          EOF

          if [ -n "${ALLOW_LOCALHOST_HOSTS:-}" ]; then
            echo "ALLOW_LOCALHOST_HOSTS = \"${ALLOW_LOCALHOST_HOSTS}\"" >> wrangler.toml
          fi

          if [ -n "${LOG_GEOCODE_HITS:-}" ]; then
            echo "LOG_GEOCODE_HITS = \"${LOG_GEOCODE_HITS}\"" >> wrangler.toml
          fi

          cat >> wrangler.toml <<EOF

          [[d1_databases]]
          binding = "DB"
          database_name = "${D1_DATABASE_NAME}"
          database_id = "${D1_DATABASE_ID}"

          [[kv_namespaces]]
          binding = "GEO_KV"
          id = "${KV_NAMESPACE_ID}"
          preview_id = "${KV_PREVIEW_ID}"

          [[ratelimits]]
          name = "GEOCODE_RATE_LIMITER"
          namespace_id = "${RATE_LIMIT_NAMESPACE_ID}"

          [ratelimits.simple]
          limit = 60
          period = 60
          EOF
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
